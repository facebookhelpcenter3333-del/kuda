<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Admin — Kuda Receipts</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #18181f;
            --surface3: #1e1e28;
            --border: rgba(255,255,255,0.07);
            --border-strong: rgba(255,255,255,0.12);
            --text: #f0f0f5;
            --text-muted: rgba(240,240,245,0.45);
            --text-dim: rgba(240,240,245,0.25);
            --accent: #00d4a0;
            --accent-dim: rgba(0,212,160,0.12);
            --danger: #ff4f4f;
            --danger-dim: rgba(255,79,79,0.12);
            --warning: #ffb020;
            --warning-dim: rgba(255,176,32,0.12);
            --blue: #4f8dff;
            --blue-dim: rgba(79,141,255,0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }

        html { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .layout { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            padding: 0 8px;
        }

        .sidebar-logo-icon {
            width: 32px; height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-logo-icon svg { width: 18px; height: 18px; stroke: #000; }

        .sidebar-logo-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 8px;
            margin-bottom: 8px;
        }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }

        .sidebar-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.15s ease;
            border: none; background: none; width: 100%; text-align: left;
        }

        .sidebar-item:hover { background: var(--surface2); color: var(--text); }
        .sidebar-item.active { background: var(--accent-dim); color: var(--accent); }

        .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

        .sidebar-footer { margin-top: auto; }

        .logout-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--danger);
            background: none; border: none; width: 100%; text-align: left;
            transition: all 0.15s ease;
        }

        .logout-btn:hover { background: var(--danger-dim); }
        .logout-btn svg { width: 16px; height: 16px; }

        /* Main */
        .main {
            margin-left: 220px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Topbar */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); }

        .topbar-right { display: flex; align-items: center; gap: 12px; }

        .status-dot {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.live::before { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
        .status-dot.error::before { background: var(--danger); }

        .refresh-btn {
            padding: 7px 14px;
            background: var(--surface3);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .refresh-btn:hover { background: var(--border); }

        /* Content */
        .content { padding: 24px 28px; flex: 1; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .stat-value.accent { color: var(--accent); }
        .stat-value.blue { color: var(--blue); }

        /* Table card */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title { font-size: 15px; font-weight: 700; color: var(--text); }
        .table-count {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface2);
            padding: 3px 8px;
            border-radius: 20px;
        }

        .table-scroll { max-height: 600px; overflow-y: auto; }
        .table-scroll::-webkit-scrollbar { width: 4px; }
        .table-scroll::-webkit-scrollbar-track { background: transparent; }
        .table-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        /* Receipt row */
        .receipt-row {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.12s ease;
        }

        .receipt-row:last-child { border-bottom: none; }
        .receipt-row:hover { background: var(--surface2); }

        .receipt-thumb-group {
            display: flex;
            gap: 3px;
        }

        .receipt-thumb {
            width: 36px; height: 36px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--surface3);
            border: 1px solid var(--border-strong);
            flex-shrink: 0;
        }

        .thumb-placeholder {
            width: 36px; height: 36px;
            border-radius: 6px;
            background: var(--surface3);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .thumb-placeholder svg { width: 14px; height: 14px; stroke: var(--text-dim); }

        .receipt-info { min-width: 0; }

        .receipt-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .receipt-meta {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .receipt-amount {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            text-align: right;
            white-space: nowrap;
        }

        .receipt-amount.credit { color: var(--accent); }

        .receipt-time {
            font-size: 11px;
            color: var(--text-dim);
            text-align: right;
            white-space: nowrap;
        }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
        }

        .badge.photo { background: var(--accent-dim); color: var(--accent); }
        .badge.no-photo { background: var(--surface3); color: var(--text-dim); }
        .badge.location { background: var(--blue-dim); color: var(--blue); }
        .badge.no-location { background: var(--danger-dim); color: var(--danger); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: var(--surface2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }

        .empty-state-icon svg { width: 24px; height: 24px; stroke: var(--text-dim); }
        .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .empty-state p { font-size: 13px; color: var(--text-muted); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            overflow-y: auto;
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal::-webkit-scrollbar { width: 4px; }
        .modal::-webkit-scrollbar-track { background: transparent; }
        .modal::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        .modal-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-head h3 { font-size: 17px; font-weight: 700; color: var(--text); }

        .modal-close {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--surface2);
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }

        .modal-close:hover { background: var(--surface3); color: var(--text); }

        .modal-body { padding: 20px 24px; }

        /* Photos side by side */
        .photos-section {
            margin-bottom: 20px;
        }

        .photos-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .photo-item { position: relative; }

        .photo-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 6px 8px 6px;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-align: center;
            border-radius: 0 0 10px 10px;
        }

        .photo-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            display: block;
        }

        .photo-missing {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .photo-missing svg { width: 28px; height: 28px; stroke: var(--text-dim); }
        .photo-missing span { font-size: 11px; color: var(--text-dim); font-weight: 500; }

        /* Detail rows */
        .detail-section {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 4px 0;
            margin-bottom: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-key {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
            margin-right: 16px;
        }

        .detail-val {
            font-size: 13px;
            color: var(--text);
            font-weight: 600;
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }

        .detail-val.accent { color: var(--accent); }
        .detail-val a { color: var(--blue); text-decoration: none; }
        .detail-val a:hover { text-decoration: underline; }

        .type-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .type-pill.credit { background: var(--accent-dim); color: var(--accent); }
        .type-pill.debit { background: var(--warning-dim); color: var(--warning); }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { width: 60px; padding: 20px 10px; }
            .sidebar-logo-text,
            .sidebar-item span,
            .logout-btn span,
            .sidebar-label { display: none; }
            .sidebar-item, .logout-btn { justify-content: center; padding: 10px; }
            .sidebar-logo { justify-content: center; }
            .main { margin-left: 60px; }
        }

        @media (max-width: 600px) {
            .content { padding: 16px; }
            .topbar { padding: 12px 16px; }
            .receipt-row { grid-template-columns: auto 1fr auto; }
            .receipt-time { display: none; }
            .photos-grid { grid-template-columns: 1fr; }
            .modal { max-height: 95vh; }
        }

        /* Loading shimmer */
        .shimmer {
            background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
            background-size: 400% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .shimmer-row {
            height: 64px;
            border-radius: var(--radius-sm);
            margin: 8px 16px;
        }
    </style>
</head>
<body>
<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z" fill="currentColor"/>
                </svg>
            </div>
            <span class="sidebar-logo-text">Kuda Admin</span>
        </div>

        <div class="sidebar-label">Menu</div>
        <nav class="sidebar-nav">
            <button class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Dashboard</span>
            </button>
            <button class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M9 11L12 14L22 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Receipts</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 17L21 12L16 7M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- Main content -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-title">Transaction Receipts</div>
            <div class="topbar-right">
                <div class="status-dot" id="statusDot">Connecting...</div>
                <button class="refresh-btn" onclick="forceRefresh()">Refresh</button>
            </div>
        </div>

        <div class="content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Transactions</div>
                    <div class="stat-value" id="statTotal">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Today</div>
                    <div class="stat-value accent" id="statToday">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Amount</div>
                    <div class="stat-value blue" id="statAmount">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">With Photos</div>
                    <div class="stat-value" id="statPhotos">—</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-card">
                <div class="table-header">
                    <div class="table-title">All Receipts</div>
                    <div class="table-count" id="tableCount">Loading...</div>
                </div>
                <div class="table-scroll" id="receiptsList">
                    <div class="shimmer-row shimmer"></div>
                    <div class="shimmer-row shimmer"></div>
                    <div class="shimmer-row shimmer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal" id="modal">
        <div class="modal-head">
            <h3>Receipt Details</h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody">
            <div class="shimmer-row shimmer"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://axotezoancnodsqzmdru.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4b3Rlem9hbmNub2RzcXptZHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMjg2MzgsImV4cCI6MjA3OTkwNDYzOH0.hL4r_xXGOgmz-kPuXjex28Yx5pACuC2kYiHQk-T4SIM';

    let allReceipts = [];
    let faceCache = {};

    async function fetchReceiptsList() {
        const url = SUPABASE_URL + '/rest/v1/receipts?select=id,username,account_name,bank_name,account_number,amount,narration,reference_number,transaction_date,transaction_type,location_latitude,location_longitude,location_accuracy,has_photo,has_back_photo,created_at&order=created_at.desc';
        const r = await fetch(url, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }

    async function fetchPhotoData(id) {
        if (faceCache[id]) return faceCache[id];
        try {
            const url = SUPABASE_URL + '/rest/v1/receipts?select=captured_face,back_camera_photo&id=eq.' + id;
            const r = await fetch(url, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
            });
            if (r.ok) {
                const d = await r.json();
                if (d && d[0]) {
                    faceCache[id] = { front: d[0].captured_face || null, back: d[0].back_camera_photo || null };
                    return faceCache[id];
                }
            }
        } catch (e) { console.error('Photo fetch failed:', e); }
        return { front: null, back: null };
    }

    window.addEventListener('load', () => {
        loadReceipts();
        setInterval(loadReceipts, 12000);
    });

    function forceRefresh() {
        allReceipts = [];
        document.getElementById('receiptsList').innerHTML = '<div class="shimmer-row shimmer"></div><div class="shimmer-row shimmer"></div>';
        loadReceipts();
    }

    async function loadReceipts() {
        const dot = document.getElementById('statusDot');
        try {
            const receipts = await fetchReceiptsList();
            dot.textContent = 'Live — ' + new Date().toLocaleTimeString();
            dot.className = 'status-dot live';
            allReceipts = receipts;
            renderList(receipts);
            renderStats(receipts);
            document.getElementById('tableCount').textContent = receipts.length + ' total';
        } catch (e) {
            dot.textContent = 'Error — retrying';
            dot.className = 'status-dot error';
            if (allReceipts.length === 0) {
                document.getElementById('receiptsList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                        <h3>Could not load receipts</h3>
                        <p>Check your connection and tap Refresh</p>
                    </div>`;
            }
        }
    }

    function renderList(receipts) {
        const list = document.getElementById('receiptsList');
        if (!receipts.length) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 12H15M9 16H15M17 21H7C5.89543 21 5 20.1046 5 19V5C5 3.89543 5.89543 3 7 3H12.5858C12.851 3 13.1054 3.10536 13.2929 3.29289L18.7071 8.70711C18.8946 8.89464 19 9.149 19 9.41421V19C19 20.1046 18.1046 21 17 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                    <h3>No receipts yet</h3>
                    <p>Receipts will appear here as transactions are made</p>
                </div>`;
            return;
        }

        list.innerHTML = receipts.map(r => {
            const hasFront = r.has_photo === true;
            const hasBack = r.has_back_photo === true;
            const hasLoc = !!(r.location_latitude && r.location_longitude);
            const isCredit = r.transaction_type === 'credit';
            const amount = Number(r.amount || 0).toLocaleString('en-NG', { minimumFractionDigits: 2 });

            return `
            <div class="receipt-row" onclick="openModal('${r.id}')">
                <div class="receipt-thumb-group">
                    ${hasFront
                        ? `<div class="thumb-placeholder" id="thumb-f-${r.id}"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>`
                        : `<div class="thumb-placeholder"><svg viewBox="0 0 24 24" fill="none"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2"/></svg></div>`
                    }
                    ${hasBack
                        ? `<div class="thumb-placeholder" id="thumb-b-${r.id}"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg></div>`
                        : `<div class="thumb-placeholder" style="opacity:0.35"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" stroke-width="2"/></svg></div>`
                    }
                </div>
                <div class="receipt-info">
                    <div class="receipt-name">
                        ${escHtml(r.username || 'Unknown')}
                        ${hasFront ? '<span class="badge photo">Front</span>' : ''}
                        ${hasBack ? '<span class="badge photo">Back</span>' : ''}
                        ${!hasFront && !hasBack ? '<span class="badge no-photo">No photo</span>' : ''}
                        ${hasLoc ? '<span class="badge location">GPS</span>' : '<span class="badge no-location">No GPS</span>'}
                    </div>
                    <div class="receipt-meta">${escHtml(r.bank_name || '')} · ${escHtml(r.account_number || '')} · ${escHtml(r.narration || '')}</div>
                </div>
                <div>
                    <div class="receipt-amount ${isCredit ? 'credit' : ''}">₦${amount}</div>
                </div>
                <div class="receipt-time">${formatAge(r.created_at)}</div>
            </div>`;
        }).join('');
    }

    function renderStats(receipts) {
        const today = new Date().toLocaleDateString();
        const todayCount = receipts.filter(r => new Date(r.created_at).toLocaleDateString() === today).length;
        const total = receipts.reduce((s, r) => s + parseFloat(r.amount || 0), 0);
        const withPhotos = receipts.filter(r => r.has_photo).length;
        document.getElementById('statTotal').textContent = receipts.length;
        document.getElementById('statToday').textContent = todayCount;
        document.getElementById('statAmount').textContent = '₦' + total.toLocaleString();
        document.getElementById('statPhotos').textContent = withPhotos + ' / ' + receipts.length;
    }

    async function openModal(id) {
        const r = allReceipts.find(x => x.id === id);
        if (!r) return;

        document.getElementById('modalOverlay').classList.add('open');
        document.getElementById('modalBody').innerHTML = '<div class="shimmer-row shimmer" style="margin:0 0 12px;height:160px;border-radius:10px;"></div><div class="shimmer-row shimmer" style="margin:0"></div>';

        const photos = await fetchPhotoData(id);
        const isCredit = r.transaction_type === 'credit';
        const hasLoc = !!(r.location_latitude && r.location_longitude);

        document.getElementById('modalBody').innerHTML = `
            <div class="photos-section">
                <div class="photos-label">Captured Photos</div>
                <div class="photos-grid">
                    <div class="photo-item">
                        ${photos.front
                            ? `<img class="photo-img" src="${photos.front}" alt="Front Camera">`
                            : `<div class="photo-missing"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>No front photo</span></div>`}
                        <div class="photo-caption">Front Camera</div>
                    </div>
                    <div class="photo-item">
                        ${photos.back
                            ? `<img class="photo-img" src="${photos.back}" alt="Back Camera">`
                            : `<div class="photo-missing"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg><span>No back photo</span></div>`}
                        <div class="photo-caption">Back Camera</div>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-row"><span class="detail-key">Username</span><span class="detail-val">${escHtml(r.username || 'Unknown')}</span></div>
                <div class="detail-row"><span class="detail-key">Type</span><span class="detail-val"><span class="type-pill ${isCredit ? 'credit' : 'debit'}">${isCredit ? 'Top-up' : 'Transfer'}</span></span></div>
                <div class="detail-row"><span class="detail-key">Amount</span><span class="detail-val accent">₦${Number(r.amount || 0).toLocaleString('en-NG', {minimumFractionDigits: 2})}</span></div>
                <div class="detail-row"><span class="detail-key">Bank</span><span class="detail-val">${escHtml(r.bank_name || 'N/A')}</span></div>
                <div class="detail-row"><span class="detail-key">Account Name</span><span class="detail-val">${escHtml(r.account_name || 'N/A')}</span></div>
                <div class="detail-row"><span class="detail-key">Account Number</span><span class="detail-val">${escHtml(r.account_number || 'N/A')}</span></div>
                <div class="detail-row"><span class="detail-key">Narration</span><span class="detail-val">${escHtml(r.narration || 'N/A')}</span></div>
                <div class="detail-row"><span class="detail-key">Reference</span><span class="detail-val" style="font-size:11px">${escHtml(r.reference_number || 'N/A')}</span></div>
                <div class="detail-row"><span class="detail-key">Date</span><span class="detail-val">${r.transaction_date ? new Date(r.transaction_date).toLocaleString() : 'N/A'}</span></div>
                <div class="detail-row">
                    <span class="detail-key">Location</span>
                    <span class="detail-val">
                        ${hasLoc
                            ? `<a href="https://maps.google.com/?q=${r.location_latitude},${r.location_longitude}" target="_blank">
                                ${Number(r.location_latitude).toFixed(5)}, ${Number(r.location_longitude).toFixed(5)}
                               </a>
                               <br><span style="font-size:10px;color:var(--text-muted)">±${Math.round(r.location_accuracy || 0)}m accuracy</span>`
                            : '<span style="color:var(--danger)">Not captured</span>'}
                    </span>
                </div>
                <div class="detail-row"><span class="detail-key">Submitted</span><span class="detail-val">${new Date(r.created_at).toLocaleString()}</span></div>
            </div>
        `;
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    function handleOverlayClick(e) {
        if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function formatAge(ts) {
        const d = new Date(ts), n = new Date();
        const m = Math.floor((n - d) / 60000);
        const h = Math.floor(m / 60);
        const days = Math.floor(h / 24);
        if (m < 1) return 'just now';
        if (m < 60) return m + 'm ago';
        if (h < 24) return h + 'h ago';
        if (days < 7) return days + 'd ago';
        return d.toLocaleDateString();
    }

    function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function logout() {
        fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/admin-login');
    }
</script>
</body>
</html>
