<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuda</title>
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="96x96" href="/img/kuda.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">
                    <img src="/img/icons8-money-96.png" alt="User" id="avatarImg">
                </div>
                <span class="greeting-text" id="greetingText">Hi, User</span>
            </div>
            <div class="header-actions">
                <div class="header-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40914C11.0108 7.05016 11.7289 6.91894 12.4272 7.03872C13.1255 7.15849 13.7588 7.52153 14.2151 8.06353C14.6713 8.60553 14.9211 9.29153 14.92 10C14.92 12 11.92 13 11.92 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 17H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="header-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="notification-badge">2</span>
                </div>
            </div>
        </div>

        <!-- Top Tabs -->
        <div class="top-tabs">
            <button class="tab-btn active">Spend</button>
            <button class="tab-btn">Save</button>
            <button class="tab-btn">Borrow</button>
            <button class="tab-btn">Invest</button>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-header">
                <div class="balance-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                        <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z" fill="currentColor"/>
                    </svg>
                    Naira Account - 2054502723
                    <button class="copy-account-btn" onclick="copyAccountNumber()">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                            <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M5 15H4C3.46957 15 2.96086 14.7893 2.58579 14.4142C2.21071 14.0391 2 13.5304 2 13V4C2 3.46957 2.21071 2.96086 2.58579 2.58579C2.96086 2.21071 3.46957 2 4 2H13C13.5304 2 14.0391 2.21071 14.4142 2.58579C14.7893 2.96086 15 3.46957 15 4V5" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
                <div class="currency-selector">
                    <span class="currency-flag">🇳🇬</span>
                    <span class="currency-text">NGN</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                        <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <div class="balance-amount" id="dashboardBalance">
                ₦50.00
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="cursor: pointer; margin-left: 8px;" onclick="toggleBalance()">
                    <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="last-updated">Last updated a few seconds ago</div>

            <div class="action-buttons-row">
                <button class="transfer-btn" onclick="goToTransfer()">
                    <div class="btn-icon-wrapper">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M12 19V5M5 12L12 5L19 12" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    Transfer
                </button>
                <button class="add-money-btn" onclick="goToAddMoney()">
                    <div class="btn-icon-wrapper">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M12 5V19M5 12H19" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    Add Money
                </button>
            </div>
        </div>

        <!-- Schedule Banner -->
        <div class="schedule-banner" id="scheduleBanner">
            <div class="schedule-banner-content">
                <div class="schedule-banner-left">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
                        <circle cx="12" cy="12" r="10" stroke="#4a2c6f" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
                        <circle cx="12" cy="12" r="8" stroke="#4a2c6f" stroke-width="1.5" fill="none"/>
                        <path d="M12 6V12L15 14" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M12 6V12L9 10" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5 5L7 7" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M17 3L19 5" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M3 12H5" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M19 12H21" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5 19L7 17" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M17 21L19 19" stroke="#4a2c6f" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="schedule-banner-text">
                    <h3>Schedule A Transfer!</h3>
                    <p>Set it, forget it, and we'll do the rest. Learn more here.</p>
                </div>
                <button class="schedule-close" onclick="closeBanner()">×</button>
            </div>
        </div>

        <!-- Quick Access -->
        <div class="quick-actions-header">
            <h3>Quick Access</h3>
            <button class="edit-btn">Edit</button>
        </div>
        <div class="quick-actions">
            <div class="action-item" onclick="alert('Airtime feature coming soon!')">
                <div class="action-icon airtime">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" fill="#FFB800" stroke="none"/>
                    </svg>
                </div>
                <span>Airtime</span>
            </div>

            <div class="action-item" onclick="alert('Internet feature coming soon!')">
                <div class="action-icon internet">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M1 4h22M1 12h22M1 20h22" stroke="#FF5733" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <span>Internet</span>
            </div>

            <div class="action-item" onclick="alert('Electricity feature coming soon!')">
                <div class="action-icon electricity">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#FF9800" stroke="none"/>
                    </svg>
                </div>
                <span>Electricity</span>
            </div>

            <div class="action-item" onclick="alert('TV feature coming soon!')">
                <div class="action-icon tv">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="7" width="20" height="15" rx="2" fill="#00c88a" stroke="none"/>
                        <path d="M17 2l-5 5-5-5" stroke="#00c88a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 13h10M7 17h6" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <span>TV</span>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="recent-transactions-header">
            <h3>Transactions</h3>
            <button onclick="goToHistory()">
                View All
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <div class="recent-transactions" id="recentTransactions">
            <!-- Transactions will be loaded here -->
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Home</span>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Send</span>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="7" cy="15" r="1" fill="currentColor"/>
                </svg>
                <span>Pay</span>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="7" cy="15" r="1" fill="currentColor"/>
                </svg>
                <span>Cards</span>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="5" r="1" fill="currentColor"/>
                    <circle cx="12" cy="12" r="1" fill="currentColor"/>
                    <circle cx="12" cy="19" r="1" fill="currentColor"/>
                </svg>
                <span>More</span>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="loading-logo"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/receipt-status.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
