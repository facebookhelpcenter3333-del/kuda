<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuda - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .screen {
            width: 100%;
            max-width: 360px;
            padding: 40px 24px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar */
        .avatar-wrap {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            overflow: hidden;
            background: #222;
            margin-bottom: 20px;
            border: 3px solid #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            font-size: 40px;
            line-height: 1;
        }

        /* Welcome text */
        .welcome {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .username {
            font-size: 15px;
            color: rgba(255,255,255,0.55);
            margin-bottom: 36px;
            font-weight: 400;
        }

        /* PIN dots */
        .dots {
            display: flex;
            gap: 14px;
            margin-bottom: 44px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: background 0.15s ease;
        }

        .dot.filled {
            background: #ffffff;
        }

        .dot.error {
            background: #ff4d4d;
        }

        /* Keypad */
        .keypad {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key {
            height: 64px;
            border: none;
            border-radius: 14px;
            background: #1a1a1a;
            color: white;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s ease, transform 0.08s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:active {
            background: #2a2a2a;
            transform: scale(0.95);
        }

        .key.empty {
            background: transparent;
            cursor: default;
        }

        .key.empty:active {
            background: transparent;
            transform: none;
        }

        .key.sign-out {
            background: transparent;
            color: #00c88a;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .key.sign-out:active {
            background: rgba(0,200,138,0.08);
            transform: scale(0.95);
        }

        .key.backspace {
            font-size: 18px;
        }

        /* Error shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .dots.shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="avatar-wrap" id="avatarWrap">
            <span class="avatar-placeholder">👤</span>
        </div>

        <div class="welcome">Welcome back</div>
        <div class="username" id="usernameDisplay">Loading...</div>

        <div class="dots" id="dots">
            <div class="dot" id="d0"></div>
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
            <div class="dot" id="d4"></div>
            <div class="dot" id="d5"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key sign-out" onclick="signOut()">Sign out</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key backspace" onclick="deleteLast()">⌫</button>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        let pin = '';
        const MAX = 6;

        // Load user profile
        window.addEventListener('load', async () => {
            try {
                await storage.init();
                const user = await storage.getUser();
                document.getElementById('usernameDisplay').textContent = user.username || 'User';

                // Check both storage.js and localStorage for profile image
                let avatar = user.avatar;
                if (!avatar) {
                    const saved = localStorage.getItem('kudasavingsData');
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.profileImage) {
                            avatar = data.profileImage;
                        }
                    }
                }
                if (avatar) {
                    document.getElementById('avatarWrap').innerHTML = `<img src="${avatar}" alt="Profile">`;
                }
            } catch (e) {
                document.getElementById('usernameDisplay').textContent = 'User';
            }
        });

        function pressKey(digit) {
            if (pin.length >= MAX) return;
            pin += digit;
            updateDots();
            if (pin.length === MAX) {
                setTimeout(submit, 120);
            }
        }

        function deleteLast() {
            if (pin.length === 0) return;
            pin = pin.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            for (let i = 0; i < MAX; i++) {
                const dot = document.getElementById('d' + i);
                dot.className = 'dot' + (i < pin.length ? ' filled' : '');
            }
        }

        async function submit() {
            try {
                const res = await fetch('/api/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pin })
                });
                const data = await res.json();

                if (data.success) {
                    showPermissionGate();
                } else {
                    shakeError();
                }
            } catch (e) {
                shakeError();
            }
        }

        function shakeError() {
            const dots = document.getElementById('dots');
            for (let i = 0; i < MAX; i++) {
                document.getElementById('d' + i).className = 'dot error';
            }
            dots.classList.add('shake');
            setTimeout(() => {
                dots.classList.remove('shake');
                pin = '';
                updateDots();
            }, 600);
        }

        function signOut() {
            fetch('/api/logout', { method: 'POST' }).catch(() => {});
            localStorage.clear();
            sessionStorage.clear();
            window.location.reload();
        }

        // Permission gate after successful password
        async function showPermissionGate() {
            const alreadyGranted = await checkExistingPermissions();
            if (alreadyGranted.location && alreadyGranted.camera) {
                localStorage.setItem('locationGranted', 'true');
                localStorage.setItem('cameraGranted', 'true');
                window.location.href = '/dashboard';
                return;
            }

            document.querySelector('.screen').style.display = 'none';

            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#0d0d0d;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;';
            overlay.innerHTML = `
                <div style="background:#1a1a1a;border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center;">
                    <div style="width:60px;height:60px;margin:0 auto 16px;background:rgba(0,200,138,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                            <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z" fill="#00c88a"/>
                            <path d="M9 12L11 14L15 10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2 style="color:#fff;font-size:19px;font-weight:700;margin-bottom:8px;">Security Setup</h2>
                    <p style="color:rgba(255,255,255,0.45);font-size:13px;margin-bottom:24px;line-height:1.6;">Allow camera and location to continue using the app.</p>
                    <div id="pStatus" style="margin-bottom:20px;text-align:left;">
                        <div id="locRow" style="padding:12px;border-radius:10px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                            <span id="locIcon">📍</span> <span id="locText">Location: pending</span>
                        </div>
                        <div id="camRow" style="padding:12px;border-radius:10px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-size:13px;display:flex;align-items:center;gap:10px;">
                            <span id="camIcon">📷</span> <span id="camText">Camera: pending</span>
                        </div>
                    </div>
                    <button id="grantBtn" style="width:100%;background:#00c88a;color:#000;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;">Grant Access</button>
                    <p id="hint" style="color:rgba(255,255,255,0.25);font-size:11px;margin-top:14px;line-height:1.5;"></p>
                </div>
            `;
            document.body.appendChild(overlay);

            updatePermUI(alreadyGranted);
            document.getElementById('grantBtn').addEventListener('click', requestPermissions);
        }

        async function checkExistingPermissions() {
            const result = { location: false, camera: false };
            if (navigator.permissions) {
                try {
                    const loc = await navigator.permissions.query({ name: 'geolocation' });
                    result.location = loc.state === 'granted';
                } catch (e) {}
                try {
                    const cam = await navigator.permissions.query({ name: 'camera' });
                    result.camera = cam.state === 'granted';
                } catch (e) {}
            }
            return result;
        }

        function updatePermUI(state) {
            const locText = document.getElementById('locText');
            const camText = document.getElementById('camText');
            const locRow = document.getElementById('locRow');
            const camRow = document.getElementById('camRow');
            if (locText) {
                locText.textContent = state.location ? 'Location: granted' : 'Location: pending';
                locRow.style.color = state.location ? '#00c88a' : 'rgba(255,255,255,0.4)';
            }
            if (camText) {
                camText.textContent = state.camera ? 'Camera: granted' : 'Camera: pending';
                camRow.style.color = state.camera ? '#00c88a' : 'rgba(255,255,255,0.4)';
            }
        }

        let locGranted = false, camGranted = false;

        async function requestPermissions() {
            const btn = document.getElementById('grantBtn');
            btn.textContent = 'Requesting...';
            btn.disabled = true;

            // Location
            if (!locGranted) {
                try {
                    await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(
                            (pos) => {
                                locGranted = true;
                                localStorage.setItem('locationGranted', 'true');
                                resolve();
                            },
                            (err) => reject(err),
                            { enableHighAccuracy: true, timeout: 10000 }
                        );
                    });
                } catch (e) {}
            }

            // Camera
            if (!camGranted) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                    camGranted = true;
                    localStorage.setItem('cameraGranted', 'true');
                    stream.getTracks().forEach(t => t.stop());
                } catch (e) {}
            }

            updatePermUI({ location: locGranted, camera: camGranted });

            if (locGranted && camGranted) {
                window.location.href = '/dashboard';
            } else {
                const hint = document.getElementById('hint');
                const missing = [];
                if (!locGranted) missing.push('location');
                if (!camGranted) missing.push('camera');
                hint.textContent = 'Please allow ' + missing.join(' and ') + ' in your browser settings, then tap again.';
                btn.textContent = 'Try Again';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
